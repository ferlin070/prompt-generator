<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <title>404 — Halaman Tidak Dijumpai | PromptBiz Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#0B0F19; --card:#161D2E; --border:#232D45; --accent:#F59E0B; --accent-l:#FBBF24; --text:#E7ECF5; --text2:#9AA5B8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .wrap { text-align: center; max-width: 480px; }
    .code { font-size: 7rem; font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -0.04em; }
    h1 { font-size: 1.6rem; font-weight: 700; margin: 16px 0 10px; }
    p { color: var(--text2); font-size: 1rem; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; background: var(--accent); color: #0B0F19; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
    .btn:hover { background: var(--accent-l); box-shadow: 0 6px 22px rgba(245,158,11,.25); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Halaman Tidak Dijumpai</h1>
    <p>Maaf, halaman yang anda cari tidak wujud atau telah dialihkan. Sila semak URL atau kembali ke laman utama.</p>
    <a href="/" class="btn">← Kembali ke Laman Utama</a>
  </div>
</body>
</html>
